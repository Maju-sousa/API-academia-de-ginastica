name: starlife

x-api-env: &api-env
  NODE_ENV: production
  PORT: 3000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-starlife}:${POSTGRES_PASSWORD:-starlife}@postgres:5432/${POSTGRES_DB:-starlife}?schema=public
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
  CORS_ORIGIN: ${CORS_ORIGIN:-*}
  CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-60}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starlife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starlife}
      POSTGRES_DB: ${POSTGRES_DB:-starlife}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # runs once so the replicas don't race on migrations
  migrate:
    build: .
    environment:
      <<: *api-env
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: starlife-api:latest
    restart: unless-stopped
    environment:
      <<: *api-env
    deploy:
      replicas: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
