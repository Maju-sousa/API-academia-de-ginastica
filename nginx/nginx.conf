worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;

  log_format main '$remote_addr [$time_local] "$request" $status '
                  'upstream=$upstream_addr rt=$request_time rid=$request_id';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  # docker dns, picks up new replicas after --scale without a reload
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream starlife_api {
    zone starlife_api 64k;
    server api:3000 resolve;
    keepalive 32;
  }

  server {
    listen 80;
    client_max_body_size 1m;

    location / {
      proxy_pass http://starlife_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;

      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }
  }
}
